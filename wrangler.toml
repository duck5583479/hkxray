name = "hkxray"
main = "src/index.js"
compatibility_date = "2026-07-24"
workers_dev = false
# 你的 路由设置
routes = [


]

[limits]
cpu_ms = 300000


[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

# 智能放置
[placement]
# mode = "smart"
# host = "91.108.56.151:443"
# host = "149.154.167.223:443"
# host = "149.154.175.59:443"
# region = "aws:ca-west-1" #温哥华
region = "gcp:asia-east-1" #台湾
# region = "aws:us-west-1" #圣何塞
# region = "gcp:us-west2"
# region = "gcp:us-south1" #德克萨斯




[[containers]]
class_name = "hkxray"
image = "./Dockerfile"
# instance_type = "standard-2"
# max_instances = 1
  [containers.instance_type]
  vcpu = 2
  memory_mib = 6144
  disk_mb = 8000
  

[containers.constraints]
regions = ["APAC"]
# jurisdiction = "fedramp"

[[durable_objects.bindings]]
name = "HKXRAY"
class_name = "hkxray"

[[migrations]]
tag = "v1"
new_sqlite_classes = [ "hkxray" ]
